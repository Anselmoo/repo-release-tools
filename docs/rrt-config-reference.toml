# Generated by 'rrt config reference' — do not edit by hand.

[tool.rrt]

# Path to the changelog file relative to the project root.
changelog_file = "..."

# Git pathspecs limiting generated changelog entries to commits touching this
# unit's own files. Empty means no path filtering. Set per version group in
# multi-group repositories.
changelog_paths = []

# How changelog entries are written. 'incremental' = append per commit;
# 'squash' = accumulate then promote on release.
# one of: incremental, squash
changelog_workflow = "incremental"

# Additional branch type prefixes beyond the built-in set.
extra_branch_types = []

# Additional conventional commit types recognized by rrt (e.g. ['security',
# 'ux']).
extra_commit_types = []

# Paths to generated files that should be staged after a bump.
generated_files = []

# Command to regenerate lockfiles after a version bump (e.g. ['uv', 'lock',
# '-U']).
lock_command = []

# Behavior when a pin target pattern has no match. Default: 'error'.
# one of: error, warn
pin_target_missing = "error"

# Which core a pre-release channel (alpha, beta, rc) targets when started from
# a FINAL version. 'patch' (default): 1.0.0 -> 1.0.1-rc.1; 'minor': 1.0.0 ->
# 1.1.0-rc.1; 'major': 1.0.0 -> 2.0.0-rc.1; 'auto': level from Conventional
# Commits since the last FINAL tag (breaking -> major, feat -> minor, else
# patch). Advancing inside a channel (rc.1 -> rc.2) or switching channel
# (beta.2 -> rc.1) never changes the core. A version_groups entry overrides
# this global value.
# one of: auto, major, minor, patch
prerelease_base = "auto"

# Release branch name template. Use {version} as a placeholder.
release_branch = "..."

# Prefix for this unit's release tags. Used as the default for 'rrt tag
# create/check --prefix' and to anchor the generated changelog range to the
# unit's own latest tag.
tag_prefix = "..."

# The grammar the version is read, bumped and written in: 'semver'
# (1.2.3-rc.1), 'pep440' (1.2.3rc1) or 'calver' (2026.05.15). No default: when
# unset it is inferred from the primary target. A calendar-shaped version
# (YYYY.MM, YYYY.MM.DD or YYYY.M.D) is calver; otherwise a pep621 or
# python_version target is pep440, and any other target is semver. A
# version_groups entry overrides this global value. rrt bump --scheme and the
# MCP rrt_bump scheme parameter override both for one run.
# one of: calver, pep440, semver
version_scheme = "calver"

# Cross-pipeline artifact protection policy checked by the `rrt doctor`
# artifact-protection lens.
[tool.rrt.artifact_protection]

# RESERVED, NOT YET ENFORCED: no check in `rrt doctor` currently reads this
# field. Setting it records intent only; it does not block anything from being
# deleted or flag any ref as protected.
protected_refs = []

# Explicit declarations of artifacts consumed by another CI job, so a storage
# cleanup does not delete an artifact a different pipeline still depends on.
[[tool.rrt.artifact_protection.consumed]]

# Artifact-relative path(s) this job consumes. Must be replaced with real
# paths. When the scanned fetch's path is known (GitLab always sets it), the
# check requires that exact path to appear here, so an unedited TODO
# placeholder is caught. GitHub fetches never carry a path, so there the check
# cannot verify this field's contents and an unedited TODO placeholder loads
# successfully but protects nothing.
artifacts = ["..."]

# CI config file(s) that perform the fetch.
consumed_by = ["..."]

# Part of the join key matched against a scanned CI fetch's (job, ref) — never
# job alone — by string equality (never split/normalized). On GitLab this is
# the real job name from the fetch URL's `?job=` parameter. On GitHub Actions,
# `actions/download-artifact` exposes no job identifier, so this must be the
# artifact's `name:` value instead; for a `run-id:`-without-`name:` fetch
# (download every artifact from the run), use the literal marker "*".
job = "..."

# Why this artifact must be protected.
reason = "..."

# Ref (branch/tag/run-id) the artifact is fetched from. Matched together with
# `job` as the join key — a match on `job` alone is not sufficient.
ref = "..."

# Documentation tree injection configuration.
[tool.rrt.docs]

badge_assets_dir = "..."

# one of: shields, svg, text
badge_style = "shields"

# one of: color, dark, light
badge_variant = "color"

docs_dir = "..."

# one of: both, explicit, implicit
extraction_mode = "both"

formats = ["..."]

languages = []

mirror_src_tree = false

source_link_badge = false

source_ref = "..."

source_repo_url = "..."

source_url_template = "..."

src_dir = "..."

# End-of-life lifecycle tracking configuration.
[tool.rrt.eol]

allow_eol = false

error_days = 0

fetch_live = false

languages = []

warn_days = 0

[[tool.rrt.eol.overrides]]

cycle = "..."

eol = "..."

language = "..."

# Map extra commit types to changelog sections (e.g. {security = 'Fixed', ux =
# 'Changed'}).
[tool.rrt.extra_section_map]

# Folder supervision policy configuration.
[tool.rrt.folders]

# one of: off, strict, warn
mode = "off"

rules = []

templates = []

# Additional files kept in sync with the release version (e.g. CI action
# pins).
[[tool.rrt.pin_targets]]

# Path to the file containing the pin, relative to the project root.
path = "..."

# Regex with 3 capture groups: (prefix)(version)(suffix).
pattern = "..."

# Upstream release source for `rrt sync` discovery.
[tool.rrt.upstream]

# Commit message template for 'rrt sync --bump --commit'; {version} is
# substituted.
commit_message = "..."

# Upstream package name (vendor/name for packagist).
package = "..."

# one of: crates, npm, nuget, packagist, pypi
provider = "crates"

# Named release units for monorepo or multi-component projects.
[[tool.rrt.version_groups]]

changelog_file = "..."

changelog_paths = []

# one of: incremental, squash
changelog_workflow = "incremental"

generated_files = []

lock_command = []

name = "..."

# pin_targets: ($ref — see the referenced section for details)

# Per-group override of the global prerelease_base (patch, minor, major or
# auto).
# one of: auto, major, minor, patch
prerelease_base = "auto"

release_branch = "..."

tag_prefix = "..."

# upstream: ($ref — see the referenced section for details)

# Per-group override of the global version_scheme (semver, pep440 or calver).
# Unset everywhere, it is inferred from the group's primary target.
# one of: calver, pep440, semver
version_scheme = "calver"

# version_targets: ($ref — see the referenced section for details)

# Files whose version strings rrt will update on bump.
[[tool.rrt.version_targets]]

# How the CI version string is formatted. Use 'pep440' for Python packages.
# one of: pep440, semver_pre
ci_format = "pep440"

# Key within 'section' that holds the version string. Must be paired with
# 'section'.
field = "..."

# Well-known target type. Use 'pattern' with a 1-capture-group regex to read
# the version from a dependency pin or arbitrary string. All other kinds are
# mutually exclusive with 'pattern' and 'section'+'field'.
# one of: cargo_toml, csproj, gemspec, go_version, maven_pom, mcp_server_json, package_json, pattern, pep621, python_version
kind = "cargo_toml"

# Path to the file containing the version string, relative to the project
# root.
path = "..."

# Regex pattern. When used with kind='pattern': exactly 1 capture group whose
# match is the version string. When used alone (no kind): exactly 3 capture
# groups (prefix)(version)(suffix). Mutually exclusive with standalone 'kind'
# and 'section'+'field'.
pattern = "..."

# TOML table section containing the version field (e.g. 'package'). Must be
# paired with 'field'.
section = "..."
